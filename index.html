<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Guitar Practice</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guitar Practice">
<meta name="theme-color" content="#1c120c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#1c120c;
    --bg-1:#2b1d14;
    --bg-2:#3a2717;
    --cream:#ede1ce;
    --cream-dim:#c9b99e;
    --cream-faint:#96876f;
    --amber:#e8963c;
    --amber-soft:rgba(232,150,60,.16);
    --amber-line:rgba(232,150,60,.4);
    --red:#c4573f;
    --green:#8fa876;
    --line:rgba(237,225,206,.1);
    --radius:14px;
    --safe-top:env(safe-area-inset-top);
    --safe-bottom:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg-0); color:var(--cream); font-family:'Inter',sans-serif; min-height:100vh;}
  .app{max-width:480px; margin:0 auto; padding:calc(20px + var(--safe-top)) 18px calc(40px + var(--safe-bottom));}

  header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px;}
  h1{font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0; letter-spacing:-0.01em;}
  .sync-dot{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--cream-faint);}
  .sync-dot .led{width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block; transition:background .2s;}
  .sync-dot.offline .led{background:var(--red);}
  .status-line{font-size:11.5px; color:var(--cream-faint); margin-bottom:20px; line-height:1.4;}

  .timer-card{
    background:var(--bg-1); border:1px solid var(--line); border-radius:var(--radius);
    padding:28px 20px 22px; text-align:center; margin-bottom:22px;
  }
  .time-display{
    font-family:'Fraunces',serif; font-weight:600; font-size:52px; letter-spacing:-0.01em;
    font-variant-numeric:tabular-nums; margin-bottom:4px;
  }
  .time-sub{font-size:12px; color:var(--cream-faint); margin-bottom:18px;}

  .timer-start-edit{font-size:12.5px; color:var(--cream-faint); margin-bottom:16px; min-height:18px;}
  .timer-start-edit .pause-link, .timer-start-edit .adjust-link{
    background:none; border:none; font-weight:600; font-size:12.5px; cursor:pointer; padding:2px 4px;
  }
  .timer-start-edit .pause-link{ color:var(--cream); text-decoration:none; border:1px solid var(--line); border-radius:14px; padding:3px 10px; }
  .timer-start-edit .pause-link.resume{ background:var(--green); border-color:var(--green); color:#1c120c; }
  .timer-start-edit .adjust-link{ color:var(--amber); text-decoration:underline; }
  .adjust-form{
    display:flex; align-items:center; justify-content:center; gap:8px; background:var(--bg-2);
    border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:6px; flex-wrap:wrap;
  }
  .adjust-form input{
    font-family:'Inter',sans-serif; font-size:13px; padding:6px 8px; border-radius:8px;
    border:1px solid var(--line); background:var(--bg-1); color:var(--cream);
  }
  .adjust-form button{border:none; border-radius:8px; padding:6px 12px; font-weight:600; font-size:12.5px; cursor:pointer;}
  .adjust-save{background:var(--green); color:#1c120c;}
  .adjust-cancel{background:var(--bg-2); color:var(--cream-dim); border:1px solid var(--line) !important;}

  .transport{display:flex; gap:10px;}
  .transport button{
    flex:1; border:none; border-radius:12px; padding:15px; font-family:'Inter',sans-serif;
    font-weight:700; font-size:15px; cursor:pointer; transition:transform .08s ease;
  }
  .transport button:active{transform:scale(0.97);}
  .btn-primary{background:var(--amber); color:#1c120c;}
  .btn-ghost{background:var(--bg-2); color:var(--cream);}
  .btn-stop{background:var(--red); color:#fff;}

  .save-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end;
    z-index:80; opacity:0; pointer-events:none; transition:opacity .15s;
  }
  .save-backdrop.open{opacity:1; pointer-events:auto;}
  .save-sheet{
    background:var(--bg-1); border-radius:20px 20px 0 0; padding:22px 20px calc(22px + var(--safe-bottom));
    width:100%; border-top:1px solid var(--line);
  }
  .save-sheet h2{font-family:'Fraunces',serif; font-size:19px; margin:0 0 4px;}
  .save-sheet .summary{color:var(--cream-faint); font-size:13px; margin-bottom:16px;}
  .save-sheet textarea{
    width:100%; min-height:70px; background:var(--bg-2); border:1px solid var(--line); border-radius:10px;
    color:var(--cream); font-family:inherit; font-size:14px; padding:10px 12px; resize:vertical; margin-bottom:14px;
  }
  .save-sheet .actions{display:flex; gap:10px;}
  .save-sheet .actions button{flex:1; border:none; border-radius:12px; padding:13px; font-weight:700; font-size:14px; cursor:pointer;}
  .save-discard{background:var(--bg-2); color:var(--cream-dim);}
  .save-confirm{background:var(--amber); color:#1c120c;}

  .panel{background:var(--bg-1); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;}
  .panel-title{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--cream-faint); font-weight:600; margin-bottom:10px;}
  .session-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .session-row:last-child{border-bottom:none;}
  .session-row .left{flex:1; min-width:0;}
  .session-row .dur{font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--amber); white-space:nowrap;}
  .session-row .meta{font-size:11.5px; color:var(--cream-faint); margin-top:1px;}
  .session-row .del-btn{
    background:none; border:none; color:var(--cream-faint); font-size:15px; cursor:pointer; padding:4px 6px;
  }
  .empty-hint{color:var(--cream-faint); font-size:13px; padding:6px 0;}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Guitar Practice</h1>
    <div class="sync-dot offline" id="syncDot"><span class="led"></span><span id="syncLabel">connecting…</span></div>
  </header>
  <div class="status-line" id="statusLine">Starting up…</div>

  <div class="timer-card">
    <div class="time-display" id="timeDisplay">0:00</div>
    <div class="time-sub">Phase 1 rebuild — timer core only</div>
    <div class="timer-start-edit" id="timerStartEdit"></div>
    <div class="transport" id="transport"></div>
  </div>

  <div class="panel">
    <div class="panel-title">Recent sessions</div>
    <div id="historyList"></div>
  </div>
</div>

<div class="save-backdrop" id="saveBackdrop">
  <div class="save-sheet">
    <h2>Nice work</h2>
    <div class="summary" id="saveSummary"></div>
    <textarea id="noteInput" placeholder="Anything worth remembering? (optional)"></textarea>
    <div class="actions">
      <button class="save-discard" id="discardBtn">Discard</button>
      <button class="save-confirm" id="saveBtn">Save session</button>
    </div>
  </div>
</div>

<script type="module">
/* =========================================================================
   FIREBASE CONFIG — same project as before, so existing session history
   carries over untouched.
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyA_qKc-UWYRwBQMCN6yUyV58gnp0AcmG1E",
  authDomain: "practicetracker-94b25.firebaseapp.com",
  projectId: "practicetracker-94b25",
  storageBucket: "practicetracker-94b25.firebasestorage.app",
  messagingSenderId: "417246148270",
  appId: "1:417246148270:web:1f9a1dc959106d1d6adf3f"
};
const FIREBASE_ENABLED = firebaseConfig.apiKey && firebaseConfig.apiKey !== "REPLACE_ME";

/* =========================================================================
   LOCAL STATE + STORAGE
   activeStart/activePausedAt mirror the baby tracker's activeFeed/
   activeSleep model exactly: a single ISO timestamp for when the timer
   started, and — while paused — a second ISO timestamp for when the pause
   began. No separate "state" field and no accumulated-ms bookkeeping.
   Resuming folds the paused gap into `start` by shifting it forward, so
   elapsed time is always just "now minus start" (or "pausedAt minus start"
   while paused). This is also exactly why it's safe to sync: the whole
   thing is either one small doc that exists (running/paused) or doesn't
   (idle) — there's no in-between state two devices could disagree about.
   ========================================================================= */
const LS_ACTIVE = "gp2_active_timer";
const LS_SESSIONS = "gp2_sessions";

let activeStart = null;
let activePausedAt = null;
let sessions = [];
let tickHandle = null;
let editingAdjust = false;
let startEditRendered = false;
let pendingSession = null;

function loadLocal(){
  try{
    const raw = JSON.parse(localStorage.getItem(LS_ACTIVE) || "null");
    if (raw){ activeStart = raw.start || null; activePausedAt = raw.pausedAt || null; }
  }catch(e){ /* ignore */ }
  try{ sessions = JSON.parse(localStorage.getItem(LS_SESSIONS) || "[]"); }
  catch(e){ sessions = []; }
}
function persistActiveLocal(){
  if (activeStart) localStorage.setItem(LS_ACTIVE, JSON.stringify({ start: activeStart, pausedAt: activePausedAt }));
  else localStorage.removeItem(LS_ACTIVE);
}
function persistSessionsLocal(){
  localStorage.setItem(LS_SESSIONS, JSON.stringify(sessions));
}

/* =========================================================================
   TIME MATH + FORMATTING
   ========================================================================= */
function effectiveNow(pausedAt){
  return pausedAt ? new Date(pausedAt).getTime() : Date.now();
}
function currentElapsedMs(){
  if (!activeStart) return 0;
  return effectiveNow(activePausedAt) - new Date(activeStart).getTime();
}
function fmtClock(ms){
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(totalSec / 3600), m = Math.floor((totalSec % 3600) / 60), s = totalSec % 60;
  const mm = String(m).padStart(2, "0"), ss = String(s).padStart(2, "0");
  return h > 0 ? `${h}:${mm}:${ss}` : `${m}:${ss}`;
}
function fmtTime(iso){
  return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}
function toLocalInputValue(iso){
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fromLocalInputValue(str){ return new Date(str).toISOString(); }
function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str == null ? "" : String(str);
  return d.innerHTML;
}

/* =========================================================================
   RENDER
   ========================================================================= */
function ensureTick(){ if (!tickHandle) tickHandle = setInterval(renderTimer, 500); }
function stopTick(){ clearInterval(tickHandle); tickHandle = null; }

function renderTimer(){
  document.getElementById("timeDisplay").textContent = fmtClock(currentElapsedMs());
  renderTransport();
  renderStartEdit();
}

function renderTransport(){
  const wrap = document.getElementById("transport");
  if (!activeStart){
    wrap.innerHTML = `<button class="btn-primary" id="startBtn">Start practicing</button>`;
    document.getElementById("startBtn").onclick = startTimer;
  } else if (activePausedAt){
    wrap.innerHTML = `<button class="btn-primary" id="resumeBtn">Resume</button><button class="btn-stop" id="finishBtn">Finish</button>`;
    document.getElementById("resumeBtn").onclick = togglePause;
    document.getElementById("finishBtn").onclick = finishTimer;
  } else {
    wrap.innerHTML = `<button class="btn-ghost" id="pauseBtn">Pause</button><button class="btn-stop" id="finishBtn">Finish</button>`;
    document.getElementById("pauseBtn").onclick = togglePause;
    document.getElementById("finishBtn").onclick = finishTimer;
  }
}

function renderStartEdit(){
  const container = document.getElementById("timerStartEdit");
  if (!activeStart){
    container.style.display = "none";
    container.innerHTML = "";
    startEditRendered = false;
    editingAdjust = false;
    return;
  }
  container.style.display = "";
  if (editingAdjust && startEditRendered) return; // form open — don't wipe unsaved typing
  startEditRendered = editingAdjust;

  if (editingAdjust){
    container.innerHTML = `<div class="adjust-form">
      <input type="datetime-local" id="adjustInput" value="${toLocalInputValue(activeStart)}">
      <button class="adjust-save" id="adjustSave">Save</button>
      <button class="adjust-cancel" id="adjustCancel">Cancel</button>
    </div>`;
    document.getElementById("adjustSave").onclick = async () => {
      const val = document.getElementById("adjustInput").value;
      if (val){
        activeStart = fromLocalInputValue(val);
        persistActiveLocal();
        await saveActiveTimerRemote();
      }
      editingAdjust = false;
      renderTimer();
    };
    document.getElementById("adjustCancel").onclick = () => { editingAdjust = false; renderTimer(); };
  } else {
    const pauseBtn = activePausedAt
      ? `<button class="pause-link resume" id="pauseToggle">▶ Resume</button>`
      : `<button class="pause-link" id="pauseToggle">⏸ Pause</button>`;
    const label = activePausedAt ? `Paused since ${fmtTime(activePausedAt)}` : `Started at ${fmtTime(activeStart)}`;
    container.innerHTML = `${pauseBtn} · ${label} · <button class="adjust-link" id="adjustOpen">adjust</button>`;
    document.getElementById("pauseToggle").onclick = togglePause;
    document.getElementById("adjustOpen").onclick = () => { editingAdjust = true; renderTimer(); };
  }
}

function renderHistory(){
  const wrap = document.getElementById("historyList");
  if (sessions.length === 0){
    wrap.innerHTML = `<div class="empty-hint">No sessions yet — hit start above whenever you've got a few minutes.</div>`;
    return;
  }
  wrap.innerHTML = "";
  sessions.slice(0, 25).forEach(s => {
    const d = new Date(s.startedAt);
    const dateStr = d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    const row = document.createElement("div");
    row.className = "session-row";
    row.innerHTML = `
      <div class="left">
        <div class="meta">${dateStr}, ${fmtTime(s.startedAt)}${s.note ? " · " + escapeHtml(s.note) : ""}</div>
      </div>
      <div class="dur">${Math.round(s.durationSec / 60)}m</div>
      <button class="del-btn" data-id="${s.id}" aria-label="Delete session">✕</button>`;
    wrap.appendChild(row);
  });
  wrap.querySelectorAll("[data-id]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Delete this session?")) return;
      await deleteSession(btn.dataset.id);
    };
  });
}

function renderAll(){
  renderTimer();
  renderHistory();
}

/* =========================================================================
   TRANSPORT ACTIONS — mirrors the baby tracker's toggle+pause+finish flow
   exactly, just for a single timer instead of feed/sleep/pump.
   ========================================================================= */
async function startTimer(){
  activeStart = new Date().toISOString();
  activePausedAt = null;
  persistActiveLocal();
  ensureTick();
  renderTimer();
  await saveActiveTimerRemote();
}

async function togglePause(){
  if (activePausedAt){
    // Resume: fold the paused stretch into `start` so it never counts
    // toward the duration, then keep ticking from where we left off.
    const gap = Date.now() - new Date(activePausedAt).getTime();
    activeStart = new Date(new Date(activeStart).getTime() + gap).toISOString();
    activePausedAt = null;
    ensureTick();
  } else {
    activePausedAt = new Date().toISOString();
    stopTick();
  }
  persistActiveLocal();
  renderTimer();
  await saveActiveTimerRemote();
}

async function finishTimer(){
  if (!activeStart) return;
  let finalStart = activeStart;
  if (activePausedAt){
    // Still paused when Finish was tapped — fold the open pause in first
    // so it doesn't count toward the logged duration.
    const gap = Date.now() - new Date(activePausedAt).getTime();
    finalStart = new Date(new Date(finalStart).getTime() + gap).toISOString();
  }
  const endMs = Date.now();
  const durationSec = Math.max(1, Math.round((endMs - new Date(finalStart).getTime()) / 1000));

  stopTick();
  activeStart = null;
  activePausedAt = null;
  persistActiveLocal();
  renderTimer();
  await saveActiveTimerRemote(); // this branch deletes the remote doc, since activeStart is now null

  pendingSession = {
    id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
    startedAt: new Date(finalStart).getTime(),
    durationSec,
    note: ""
  };
  openSaveSheet(durationSec);
}

/* =========================================================================
   SAVE SHEET
   ========================================================================= */
function openSaveSheet(durationSec){
  const mins = Math.max(1, Math.round(durationSec / 60));
  document.getElementById("saveSummary").textContent = `${mins} minute${mins === 1 ? "" : "s"} of practice.`;
  document.getElementById("noteInput").value = "";
  document.getElementById("saveBackdrop").classList.add("open");
}
function closeSaveSheet(){
  document.getElementById("saveBackdrop").classList.remove("open");
}
document.getElementById("discardBtn").onclick = () => { pendingSession = null; closeSaveSheet(); };
document.getElementById("saveBtn").onclick = async () => {
  if (!pendingSession) return closeSaveSheet();
  pendingSession.note = document.getElementById("noteInput").value.trim();
  const session = pendingSession;
  pendingSession = null;
  closeSaveSheet();
  await saveSession(session);
};

async function saveSession(session){
  sessions.unshift(session);
  persistSessionsLocal();
  renderHistory();
  await persistSessionRemote(session);
}
async function deleteSession(id){
  sessions = sessions.filter(x => x.id !== id);
  persistSessionsLocal();
  renderHistory();
  await deleteSessionRemote(id);
}

/* =========================================================================
   FIREBASE — same shared-project, no-login approach as before.

   DATA MODEL (mirrors the baby tracker's fixed/current version exactly):
     guitarPractice/activeTimer         — { start, pausedAt } while running
                                           or paused; the doc is deleted
                                           entirely when idle. Exists-or-
                                           doesn't is the whole sync story —
                                           no state field, no timestamp
                                           conflict resolution needed.
     guitarPractice/sessions/items/{id} — one doc per completed session.
                                           Never a wholesale overwrite, so
                                           no device's local state can ever
                                           stomp the rest of the history.
     guitarPractice/sessions            — the old array-doc, left in place
                                           untouched as a passive backup /
                                           one-time migration source.
   ========================================================================= */
let fbFns = {};
let fb = { app: null, db: null, ready: false };
let activeTimerDocRef, sessionsColRef, legacySessionsDocRef;

function markSyncOnline(){
  document.getElementById("syncDot").classList.remove("offline");
  document.getElementById("syncLabel").textContent = "synced";
}
function markSyncOffline(){
  document.getElementById("syncDot").classList.add("offline");
  document.getElementById("syncLabel").textContent = "offline";
}

async function initFirebase(){
  if (!FIREBASE_ENABLED){
    document.getElementById("statusLine").textContent = "Local-only mode — add your Firebase config to sync across devices.";
    markSyncOffline();
    return;
  }
  try{
    const [{ initializeApp }, fsMod] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"),
    ]);
    fbFns = {
      getFirestore: fsMod.getFirestore, doc: fsMod.doc, collection: fsMod.collection,
      setDoc: fsMod.setDoc, deleteDoc: fsMod.deleteDoc,
      getDoc: fsMod.getDoc, getDocs: fsMod.getDocs, onSnapshot: fsMod.onSnapshot
    };

    fb.app = initializeApp(firebaseConfig);
    fb.db = fbFns.getFirestore(fb.app);
    activeTimerDocRef = fbFns.doc(fb.db, "guitarPractice", "activeTimer");
    legacySessionsDocRef = fbFns.doc(fb.db, "guitarPractice", "sessions");
    sessionsColRef = fbFns.collection(fb.db, "guitarPractice", "sessions", "items");
    fb.ready = true;

    document.getElementById("statusLine").textContent = "Syncing — every device that opens this page shares the same timer and log.";
    await migrateLegacySessionsIfNeeded();
    subscribeActiveTimer();
    subscribeSessions();
  } catch(e){
    console.error("Firebase init failed:", e);
    document.getElementById("statusLine").textContent = "Couldn't connect to Firebase — running local-only for now.";
    markSyncOffline();
  }
}

async function saveActiveTimerRemote(){
  if (!fb.ready) return;
  try{
    if (activeStart){
      await fbFns.setDoc(activeTimerDocRef, { start: activeStart, pausedAt: activePausedAt || null });
    } else {
      await fbFns.deleteDoc(activeTimerDocRef);
    }
    markSyncOnline();
  } catch(e){
    console.error("Firestore active-timer write failed:", e);
    markSyncOffline();
  }
}

function subscribeActiveTimer(){
  const { onSnapshot } = fbFns;
  onSnapshot(activeTimerDocRef, (snap) => {
    activeStart = snap.exists() ? snap.data().start : null;
    activePausedAt = snap.exists() ? (snap.data().pausedAt || null) : null;
    persistActiveLocal();
    if (activeStart && !activePausedAt) ensureTick(); else stopTick();
    renderTimer();
    markSyncOnline();
  }, (err) => {
    console.error("active timer onSnapshot error:", err);
    markSyncOffline();
  });
}

async function persistSessionRemote(session){
  if (!fb.ready) return;
  try{ await fbFns.setDoc(fbFns.doc(sessionsColRef, session.id), session); }
  catch(e){ console.error("Firestore session write failed:", e); }
}
async function deleteSessionRemote(id){
  if (!fb.ready) return;
  try{ await fbFns.deleteDoc(fbFns.doc(sessionsColRef, id)); }
  catch(e){ console.error("Firestore session delete failed:", e); }
}

// One-time, additive-only migration from the old single-array document.
// Never deletes or rewrites the legacy doc, so it stays intact as a
// fallback no matter how many times this runs.
const LS_MIGRATED = "gp2_migrated_sessions_v1";
async function migrateLegacySessionsIfNeeded(){
  if (localStorage.getItem(LS_MIGRATED) === "1") return;
  try{
    const { getDoc, getDocs, setDoc, doc } = fbFns;
    const [legacySnap, existingItemsSnap] = await Promise.all([
      getDoc(legacySessionsDocRef),
      getDocs(sessionsColRef)
    ]);
    if (legacySnap.exists() && Array.isArray(legacySnap.data().list) && existingItemsSnap.empty){
      const legacyList = legacySnap.data().list;
      for (const s of legacyList){
        if (!s || !s.id) continue;
        await setDoc(doc(sessionsColRef, s.id), s, { merge: true });
      }
      console.log(`Migrated ${legacyList.length} session(s) from the legacy document into the per-session collection.`);
    }
    localStorage.setItem(LS_MIGRATED, "1");
  } catch(e){
    console.error("Legacy session migration failed (legacy doc left untouched):", e);
  }
}

const LS_LAST_REMOTE_COUNT = "gp2_last_remote_session_count";
function subscribeSessions(){
  const { onSnapshot } = fbFns;
  onSnapshot(sessionsColRef, (snap) => {
    const remoteSessions = snap.docs.map(d => d.data());
    const lastKnownCount = parseInt(localStorage.getItem(LS_LAST_REMOTE_COUNT) || "0", 10);

    if (remoteSessions.length === 0 && lastKnownCount > 3){
      console.warn(`Sessions came back empty from Firestore, but ${lastKnownCount} were last synced. Not touching local data.`);
      document.getElementById("statusLine").textContent = `⚠️ Sync looks empty (expected ~${lastKnownCount} sessions) — showing your last saved copy, nothing deleted. Check your Firestore rules.`;
      markSyncOffline();
      return;
    }

    sessions = remoteSessions.sort((a, b) => b.startedAt - a.startedAt);
    persistSessionsLocal();
    localStorage.setItem(LS_LAST_REMOTE_COUNT, String(sessions.length));
    renderHistory();
    markSyncOnline();
  }, (err) => {
    console.error("sessions onSnapshot error:", err);
    markSyncOffline();
  });
}

/* =========================================================================
   BOOT
   ========================================================================= */
loadLocal();
if (activeStart && !activePausedAt) ensureTick();
renderAll();
initFirebase();

document.addEventListener("visibilitychange", () => { if (!document.hidden) renderTimer(); });
</script>
</body>
